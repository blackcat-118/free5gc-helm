{{- with .Values.upf }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "free5gc-upf.fullname" $ }}-headless
  labels:
    {{- include "free5gc-upf.labels" $ | nindent 4 }}
    project: {{ $.Values.global.projectName }}
    nf: {{ .name }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - port: {{ .service.port }}
      targetPort: {{ .service.port }}
      protocol: TCP
      name: http
  selector:
    {{- include "free5gc-upf.selectorLabels" $ | nindent 4 }}
    project: {{ $.Values.global.projectName }}
    nf: {{ .name }}
{{- end }}

---

{{- range $i := until 5 }}
apiVersion: v1
kind: Service
metadata:
  name: free5gc-upf-{{ $i }}-nodeport
spec:
  type: NodePort
  selector:
    statefulset.kubernetes.io/pod-name: free5gc-premier-free5gc-upf-upf-{{ $i }}
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: {{ add 30080 $i }}
---
{{- end }}



